name: Build Frame Inspector iOS
on:
  push:
    branches: [codex/frame-inspector-ios-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build iPhone and iPad package
        uses: geode-sdk/build-geode-mod@dce36b35e1c3d9d8af92347760b12eba3caf4004
        id: build
        with:
          sdk: given
          bindings-ref: acb2c10d5de79fecec11e6f91f5e929447738b2e
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF
          target: iOS
      - uses: actions/upload-artifact@v4
        with:
          name: Frame-Inspector-iOS
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
